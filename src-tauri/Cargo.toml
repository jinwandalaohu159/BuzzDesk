[package]
name = "desktop_layer"
version = "0.1.0"
description = "A glass desktop layer with virtual folders"
authors = ["Desktop Layer"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_layer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desktop-layer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell"
] }
